[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kalshi-culture-analyzer"
version = "0.1.0"
description = "Kalshi Culture/Event Flow Analyzer and Dataset Builder"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "cryptography>=42.0",
]

[project.optional-dependencies]
parquet = ["pandas>=2.0", "pyarrow>=15.0"]

[project.scripts]
kalshi-analyzer = "kalshi_culture_analyzer.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
